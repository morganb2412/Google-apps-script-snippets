name: DevBridge Extension CI
on:
  push:
    paths: ["Google Meet/Legacy DevBridge/extension/**", ".github/workflows/extension-ci.yml"]
  pull_request:
    paths: ["Google Meet/Legacy DevBridge/extension/**", ".github/workflows/extension-ci.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Google Meet/Legacy DevBridge/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "Google Meet/Legacy DevBridge/extension/package-lock.json" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
